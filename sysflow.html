function importFile(file) {
  var reader = new FileReader();
  reader.onload = function () {
    var list;
    try {
      var raw = JSON.parse(String(reader.result));
      list = Array.isArray(raw) ? raw : [raw];      // 旧接口 /api/graph/all 直接返回数组
      if (!list.length) throw new Error('文件里没有图');
    } catch (err) {
      toast('导入失败：' + (err && err.message ? err.message : '文件格式不正确'), 'err');
      return;
    }
    var docs = [], skipped = 0;
    list.forEach(function (item) {
      try { docs.push(normalizeDoc(item)); } catch (e) { skipped++; }
    });
    if (!docs.length) { toast('导入失败：没有可识别的信号图', 'err'); return; }
    if (skipped) toast('已跳过 ' + skipped + ' 张无法识别的图', 'warn');
    importDocs(docs);
  };
  reader.readAsText(file, 'utf-8');
}

/** 1 张 → 替换当前画布（先确认）；多张 → 全部进图库并打开第一张 */
function importDocs(docs) {
  if (docs.length === 1) {
    var doc = docs[0];
    confirmDialog('导入信号图',
      '将载入「' + esc(doc.name) + '」：' + doc.graph.devices.length + ' 台设备 / ' + doc.graph.links.length + ' 条连线。<br>当前画布会被替换（可用 Ctrl+Z 撤回上一步操作，但不恢复整图）。',
      function () {
        disarm();
        S.undo = []; S.redo = [];
        S.doc = doc;
        S.view.mode = suggestedMode(doc);
        $('graphName').value = S.doc.name;
        mirrorBPorts();
        persistCurrent();
        applyViewMode();
        toast('已导入：' + doc.name +
          (S.view.mode === 'routing' ? '（该图只有信号连线，已切到 IP 路由视图）' : ''), 'ok');
      }, '导入', false);
    return;
  }

  var lib = lsGet(LS_LIB, []);
  var now = new Date().toISOString();
  var first = null;
  docs.forEach(function (d) {
    d.id = uid('g');
    d.graph.name = d.name;
    var rec = { id: d.id, name: d.name, updatedAt: now, graph: d.graph, layout: d.layout };
    lib.push(rec);
    if (!first) first = rec;
  });
  lsSet(LS_LIB, lib);
  S.library = lib;
  openDoc(first);
  toast('已导入 ' + docs.length + ' 张图到图库，当前打开「' + first.name + '」', 'ok');
}

    });
    return rows || '<tr><td colspan="6" style="color:#64748b;padding-bottom:8px">暂无端口</td></tr>';
  }

  html += '<div class="card"><h4>输入端口<span class="sp"></span>' +

    '<table class="tbl"><thead><tr><th>#</th><th>端口号</th><th>类型</th><th>属性</th><th></th><th></th></tr></thead>' +
    '<tbody>' + portRows(left, 'in') + '</tbody></table></div>';

  html += '<div class="card"><h4>输出端口<span class="sp"></span>' +
    '<button class="ghost" data-add-port="out">＋ 添加端口</button></h4>' +
    '<table class="tbl"><thead><tr><th>#</th><th>端口号</th><th>类型</th><th>属性</th><th></th><th></th></tr></thead>' +
    '<tbody>' + portRows(right, 'out') + '</tbody></table>' +
    '<div class="hintline">IP 端口天然双向；SDI/ASI 勾「双向」后也可作为起点与落点。</div></div>';

  html += '<div class="card"><h4>输出节目</h4>';
  if (!right.length) html += '<div class="hintline">没有输出端口</div>';
  right.forEach(function (p, i) {
    html += '<div class="row"><label class="w120">输出口' + (i + 1) + '（' + esc(p.number) + '）</label>' +
      '<input type="text" class="grow" data-port="' + esc(p.id) + '" data-f="program" value="' + esc(p.program || '') + '"></div>';
  });
  html += '</div>';

  html += '<div class="card"><h4>内部链接<span class="sp"></span>' +
    '<button class="ghost" data-add-il="1">＋ 添加链接</button></h4>' +
    '<div class="hintline">转发设备用：流从「入端口」进来后从指定「出端口」出去（如交换机/光传输）。没有内部链接时按同地址规则自动找出口。</div>';
  (work.inner_links || []).forEach(function (il, i) {
    html += '<div class="row" data-il-row="' + i + '">' +
      '<select data-il="' + i + '" data-f="from" style="flex:1">' + left.map(function (p) {
        return '<option value="' + esc(p.number) + '"' + (p.number === il.from_port ? ' selected' : '') + '>' + esc(p.number) + '</option>';
      }).join('') + '</select><span style="color:#64748b">→</span>' +
      '<select data-il="' + i + '" data-f="to" style="flex:1">' + right.map(function (p) {
        return '<option value="' + esc(p.number) + '"' + (p.number === il.to_port ? ' selected' : '') + '>' + esc(p.number) + '</option>';
      }).join('') + '</select>' +
      '<button class="mini danger" data-del-il="' + i + '">删除</button></div>';

}

function openDeviceEditor(deviceId) {
  var device = deviceById(deviceId);
  if (!device) return;
  var work = deep(device);

  var mask = modal({
    title: '编辑设备', sub: work.name, size: 'wide', body: deviceFormHtml(work),
    buttons: [
      { label: '取消' },
      { label: '保存', cls: 'primary', onClick: function () { updateDevice(deviceId, work); toast('设备已更新', 'ok'); } }
    ]
  });

  var body = mask.querySelector('.mbody');
  var rerender = function () {
    body.innerHTML = deviceFormHtml(work);
    // 重新渲染后恢复滚动位置，避免添加端口时跳回顶部
    var sc = body.scrollTop;
    body.scrollTop = sc;
  };

  // 输入同步：DOM → work（work 始终是唯一编辑副本）
  body.addEventListener('input', function (e) {
    var t = e.target;
    var f = t.getAttribute('data-f');
    if (!f) return;
    var portId = t.getAttribute('data-port');
    if (portId) {
      var port = work.ports.filter(function (p) { return p.id === portId; })[0];
      if (!port) return;
      if (f === 'number') port.number = t.value;
      else if (f === 'type') {
        port.type = t.value;
        if (port.type === 'ip_port') port.bidirectional = true;
      } else if (f === 'bidi') port.bidirectional = t.checked;
      else if (f === 'program') port.program = t.value;
      return;
    }
    var ilIdx = t.getAttribute('data-il');
    if (ilIdx !== null) {
      var il = work.inner_links[Number(ilIdx)];
      if (il) il[f === 'from' ? 'from_port' : 'to_port'] = t.value;
      return;
    }
    if (f === 'name') work.name = t.value;
    if (f === 'sparse') work.sparse_ports = t.checked;
  });
  body.addEventListener('change', function (e) {
    var t = e.target;
    var f = t.getAttribute('data-f');
    if (f === 'type') {
      var pid2 = t.getAttribute('data-port');
      var port2 = pid2 ? work.ports.filter(function (p) { return p.id === pid2; })[0] : null;
      if (port2) { port2.type = t.value; if (port2.type === 'ip_port') port2.bidirectional = true; }
      rerender();                                // 类型变化会影响「双向」列与组播按钮
    } else if (f === 'bidi' || f === 'sparse') {
      if (f === 'sparse') work.sparse_ports = t.checked;
      else {
        var pid3 = t.getAttribute('data-port');
        var port3 = pid3 ? work.ports.filter(function (p) { return p.id === pid3; })[0] : null;
        if (port3) port3.bidirectional = t.checked;
      }
    }
  });

  body.addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-add-port]'))) {
      work.ports.push({
        id: uid('p'), number: 'X', type: 'ip_port', direction: b.getAttribute('data-add-port'),
        bidirectional: true, program: '', multicast_in: [], multicast_out: []
      });
      rerender();
      return;
    }
    if ((b = e.target.closest('[data-del-port]'))) {
      var pid = b.getAttribute('data-del-port');
      work.ports = work.ports.filter(function (p) { return p.id !== pid; });
      rerender();
      return;
    }
    if ((b = e.target.closest('[data-add-il]'))) {
      var firstIn = work.ports.filter(function (p) { return p.direction === 'in'; })[0];
      var firstOut = work.ports.filter(function (p) { return p.direction === 'out'; })[0];
      work.inner_links = work.inner_links || [];
      work.inner_links.push({ from_port: firstIn ? firstIn.number : '', to_port: firstOut ? firstOut.number : '' });
      rerender();
      return;
    }
    if ((b = e.target.closest('[data-del-il]'))) {
      work.inner_links.splice(Number(b.getAttribute('data-del-il')), 1);
      rerender();
      return;
    }
    if ((b = e.target.closest('[data-mc-port]'))) {
      var port = work.ports.filter(function (p) { return p.id === b.getAttribute('data-mc-port'); })[0];
      if (port) openMulticastModal(port, { live: false, onChange: rerender });
    }
  });
}

/* ---- 组播配置 ---- */
function multicastBodyHtml(port, outs) {
  var html = '';
  html += '<div class="card"><h4>输入组播地址' +
    '<span class="sp" style="font-weight:400;font-size:11px;color:#64748b">由信号连线自动生成 · 地址跟随源端 · 只读</span></h4>';
  if (!(port.multicast_in || []).length) html += '<div class="hintline">暂无输入组播（建立信号连线后自动生成）</div>';
  (port.multicast_in || []).forEach(function (m, i) {
    html += '<div class="row"><span style="color:#64748b;width:44px">SRT' + (i + 1) + '</span>' +
      '<span class="mono grow">' + esc(m.address) + '</span><span style="color:#94a3b8;width:150px">' + esc(m.name) + '</span></div>';
  });
  html += '</div>';

  html += '<div class="card"><h4>输出组播地址' + (isMirror(port)
    ? '<span class="sp" style="font-weight:400;font-size:11px;color:#64748b">B 口自动跟随同号 A 口 · 只读</span>'
    : '<span class="sp"></span><button class="ghost" data-mc-add="1">＋ 添加</button>') + '</h4>';
  if (!outs.length) html += '<div class="hintline">暂无输出组播' + (isMirror(port) ? '' : '，点「添加」新增') + '</div>';
  outs.forEach(function (m, i) {
    if (isMirror(port)) {
      html += '<div class="row"><span style="color:#64748b;width:44px">SRT' + (i + 1) + '</span>' +
        '<span class="mono grow">' + esc(m.address) + '</span><span style="color:#94a3b8;width:150px">' + esc(m.name) + '</span></div>';
    } else {
      html += '<div class="row"><span style="color:#64748b;width:44px">SRT' + (i + 1) + '</span>' +
        '<input type="text" class="grow mono" data-mc="' + i + '" data-f="address" placeholder="udp://239.0.0.21:5000" value="' + esc(m.address) + '">' +
        '<input type="text" style="width:170px" data-mc="' + i + '" data-f="name" placeholder="信号名称，如 Stream 01" value="' + esc(m.name) + '">' +
        '<button class="mini danger" data-mc-del="' + i + '">删除</button></div>';
    }
  });
  if (!isMirror(port)) {
    html += '<div class="hintline">组播地址即流标识：改地址会让全图的接收条目与信号连线自动跟随；删除后对应接收条目会被清理。</div>';
  }
  html += '</div>';
  return html;
}

function openMulticastModal(port, opts) {
  opts = opts || {};
  var outs = deep(port.multicast_out || []);
  var mask = modal({
    title: '端口 ' + port.number + ' 组播配置',
    sub: (opts.live ? '画布端口' : '设备编辑中') + ' · ' + port.type,
    body: multicastBodyHtml(port, outs),
    buttons: [
      { label: '取消' },
      { label: '确定', cls: 'primary', onClick: apply }
    ]
  });
  var body = mask.querySelector('.mbody');
  var rerender = function () {
    var sc = body.scrollTop;
    body.innerHTML = multicastBodyHtml(port, outs);
    body.scrollTop = sc;
  };
  function apply() {
    if (isMirror(port)) return true;
    var ok = applyPortMulticast(port, outs, !!opts.live);
    if (ok && opts.onChange) opts.onChange();
    return ok;
  }
  body.addEventListener('input', function (e) {
    var t = e.target;
    var i = t.getAttribute('data-mc');
    if (i === null) return;
    var f = t.getAttribute('data-f');
    outs[Number(i)][f === 'address' ? 'address' : 'name'] = t.value;
  });
  body.addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-mc-add]'))) {
      outs.push({ id: uid('mc'), address: '', name: '' });
      rerender();
      return;
    }
    if ((b = e.target.closest('[data-mc-del]'))) {
      outs.splice(Number(b.getAttribute('data-mc-del')), 1);
      rerender();
    }
  });
}

function openTemplateEditor(tpl) {
  var work = deep(tpl);
  if (!work.id) work.id = uid('tpl');
  var mask = modal({
    title: tpl.id ? '编辑设备模板' : '新建设备模板',
    size: 'wide',
    body: templateFormHtml(work),
    buttons: [
      { label: '取消' },
      {
        label: '保存', cls: 'primary', onClick: function () {
          if (!work.name.trim() || !work.type.trim()) { toast('模板名称与类型标识不能为空', 'warn'); return false; }
          var dup = (lsGet(LS_TPL, []) || []).filter(function (x) { return x.type === work.type && x.id !== work.id; });
          if (dup.length) { toast('类型标识「' + work.type + '」已被模板「' + dup[0].name + '」占用', 'warn'); return false; }
          work.ports = (work.ports || []).map(function (p) { return { number: String(p.number), type: p.type, direction: p.direction, bidirectional: p.type === 'ip_port' ? true : !!p.bidirectional, program: '' }; });
          var list = lsGet(LS_TPL, []);
          if (tpl.id) {
            var idx = -1;
            list.forEach(function (x, i) { if (x.id === tpl.id) idx = i; });
            if (idx >= 0) list[idx] = work; else list.push(work);
          } else {
            list.push(work);
          }
          lsSet(LS_TPL, list);
          S.templates = list;
          toast('模板已保存：' + work.name, 'ok');
        }
      }
    ]
  });
  var body = mask.querySelector('.mbody');
  var rerender = function () { body.innerHTML = templateFormHtml(work); };
  body.addEventListener('input', function (e) {
    var t = e.target, f = t.getAttribute('data-f');
    var ti = t.getAttribute('data-tp');
    if (ti !== null) {
      var p = work.ports[Number(ti)];
      if (!p) return;
      if (f === 'number') p.number = t.value;
      else if (f === 'type') { p.type = t.value; if (p.type === 'ip_port') p.bidirectional = true; }
      else if (f === 'direction') p.direction = t.value;
      else if (f === 'bidi') p.bidirectional = t.checked;
      return;
    }
    var tf = t.getAttribute('data-tf');
    if (tf) work[tf] = t.value;
  });
  body.addEventListener('change', function (e) {
    var t = e.target, f = t.getAttribute('data-f'), ti = t.getAttribute('data-tp');
    if (ti === null) return;
    var p = work.ports[Number(ti)];
    if (!p) return;
    if (f === 'type') { p.type = t.value; if (p.type === 'ip_port') p.bidirectional = true; }
    if (f === 'direction') p.direction = t.value;
    if (f === 'bidi') p.bidirectional = t.checked;
  });
  body.addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-tp-add]'))) {
      work.ports = work.ports || [];
      work.ports.push({ number: String(work.ports.length + 1), type: 'ip_port', direction: 'out', bidirectional: true, program: '' });
      rerender();
      return;
    }
    if ((b = e.target.closest('[data-tp-del]'))) {
      work.ports.splice(Number(b.getAttribute('data-tp-del')), 1);
      rerender();
    }
  });
}

function normalizeTemplate(raw) {
  var t = {
    id: String(raw.id || uid('tpl')),
    type: String(raw.type || '').trim(),
    name: String(raw.name || '').trim(),
    description: String(raw.description || ''),
    ports: [],
    inner_links: []
  };
  (Array.isArray(raw.ports) ? raw.ports : []).forEach(function (p, i) {
    if (!p) return;
    t.ports.push({
      number: String(p.number === undefined ? i + 1 : p.number),
      type: PORT_TYPES.indexOf(p.type) >= 0 ? p.type : 'ip_port',
      direction: p.direction === 'in' ? 'in' : 'out',
      bidirectional: p.type === 'ip_port' || p.bidirectional === true,
      program: String(p.program || '')
    });
  });
  (Array.isArray(raw.inner_links) ? raw.inner_links : []).forEach(function (l) {
    if (l) t.inner_links.push({ from_port: String(l.from_port || ''), to_port: String(l.to_port || '') });
  });
  return t;
}

/** 导入设备模板 JSON（数组，或 {templates:[...]}）；同 type 已存在则跳过 */
function importTemplates(file) {
  var reader = new FileReader();
  reader.onload = function () {
    var list;
    try {
      var raw = JSON.parse(String(reader.result));
      list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.templates) ? raw.templates : [raw]);
    } catch (err) {
      toast('模板导入失败：文件不是合法 JSON', 'err');
      return;
    }
    var lib = lsGet(LS_TPL, []);
    var byType = {};
    lib.forEach(function (t) { byType[t.type] = 1; });
    var added = 0, skipped = 0;
    list.forEach(function (item) {
      if (!item || typeof item !== 'object') { skipped++; return; }
      var tpl = normalizeTemplate(item);
      if (!tpl.type || !tpl.name || byType[tpl.type]) { skipped++; return; }
      byType[tpl.type] = 1;
      lib.push(tpl);
      added++;
    });
    if (!added) { toast('没有新增模板（' + skipped + ' 个已存在或无效）', 'warn'); return; }
    lsSet(LS_TPL, lib);
    S.templates = lib;
    toast('已导入 ' + added + ' 个模板' + (skipped ? '，跳过 ' + skipped + ' 个' : ''), 'ok');
    openTemplateManager();
  };
  reader.readAsText(file, 'utf-8');
}

function openTemplateManager() {
  var body = '';
  if (!S.templates.length) body += '<div class="hintline">还没有模板</div>';
  S.templates.forEach(function (t) {
    body += '<div class="list-row"><div><div class="nm">' + esc(t.name) + ' <span class="tag">' + esc(t.type) + '</span></div>' +
      '<div class="ds">' + esc(t.description || '') + ' · 端口 ' + (t.ports || []).length + '</div></div>' +
      '<div class="sp"><button class="mini" data-tpl-edit="' + esc(t.id) + '">编辑</button>' +
      '<button class="mini danger" data-tpl-del="' + esc(t.id) + '">删除</button></div></div>';
  });
  var mask = modal({
    title: '设备模板', sub: '添加设备时可选', size: 'wide', body: body,
    buttons: [
      { label: '导入模板…', onClick: function () { setTimeout(function () { $('tplInput').click(); }, 0); } },
      { label: '新建模板', cls: 'primary', onClick: function () { setTimeout(function () { openTemplateEditor({ type: '', name: '', description: '', ports: [], inner_links: [] }); }, 0); } },
      { label: '关闭' }
    ]
  });
  mask.addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-tpl-edit]'))) {
      var tpl = templateById(b.getAttribute('data-tpl-edit'));
      if (tpl) openTemplateEditor(tpl);
      return;
    }
    if ((b = e.target.closest('[data-tpl-del]'))) {
      var id = b.getAttribute('data-tpl-del');
      var target = templateById(id);
      confirmDialog('删除模板', '删除「' + esc(target ? target.name : id) + '」？已放到画布上的设备不受影响。', function () {
        var list = lsGet(LS_TPL, []).filter(function (x) { return x.id !== id; });
        lsSet(LS_TPL, list);
        S.templates = list;
        // 定时器里先关掉（自动关闭后）仍存在的模板管理器，再重开一份最新的
        setTimeout(function () { closeModal(); openTemplateManager(); }, 0);
      }, '删除');
    }
  });
}

    title: '图库', sub: lib.length + ' 张图', body: body,
    buttons: [
      { label: '载入示例', onClick: function () { setTimeout(openDemo, 0); } },
      { label: '另存当前为新图', onClick: function () { setTimeout(saveAsNew, 0); } },
      { label: '关闭' }
    ]
  });
  mask.addEventListener('click', function (e) {
    var b;
    if ((b = e.target.closest('[data-lib-open]'))) {
      var rec = lib.filter(function (x) { return x.id === b.getAttribute('data-lib-open'); })[0];
      if (rec) { closeModal(); openDoc(rec); }
      return;
    }
    if ((b = e.target.closest('[data-lib-del]'))) {
      var id = b.getAttribute('data-lib-del');
      var rec2 = lib.filter(function (x) { return x.id === id; })[0];
      confirmDialog('删除图', '删除图库里的「' + esc(rec2 ? rec2.name : id) + '」？此操作不可撤销。', function () {
        var next = lsGet(LS_LIB, []).filter(function (x) { return x.id !== id; });
        lsSet(LS_LIB, next);
        if (S.doc.id === id) S.doc.id = null;
        setTimeout(function () { closeModal(); openLibrary(); }, 0);
        toast('已删除', 'ok');
      }, '删除');
    }
  });
}

/* ============================================================================
 * 画布交互：拖拽 / 平移 / 缩放 / 连线 / 右键菜单
 * ========================================================================= */
function onCanvasPointerDown(e) {
  hideMenu();
  if (e.button === 2) return;
  var t = e.target;

  var portEl = t.closest ? t.closest('[data-port]') : null;
  if (portEl) {
    var ref = parsePortAttr(portEl.getAttribute('data-port'));
    if (!ref) return;
    e.preventDefault();
    // 双击端口 = 打开组播配置。画布每次点击都会重绘，原生 dblclick 在元素被替换后不可靠，
    // 因此自己按「两次 pointerdown 同端口且间隔 < 320ms」判定。
    var now = Date.now(), key = ref.device + ':' + ref.port;
    var last = S.view.lastPortDown;
    if (last && last.key === key && now - last.t < 320) {
      S.view.lastPortDown = null;
      var found = portByRef(ref.device, ref.port);
      if (found && isBidi(found.port)) { openMulticastModal(found.port, { live: true }); return; }
    }
    S.view.lastPortDown = { key: key, t: now };

    S.view.selectedDevice = ref.device;
    S.drag = { type: 'wire', from: ref, startX: e.clientX, startY: e.clientY, moved: false };
    renderAll();
    return;
  }

  var devEl = t.closest ? t.closest('[data-dev]') : null;
  if (devEl) {
    var dev = deviceById(devEl.getAttribute('data-dev'));
    if (!dev) return;
    e.preventDefault();
    S.view.selectedDevice = dev.id;
    if (S.view.mode === 'relation') {         // 关系图是只读视图：坐标现算，不写回 layout
      S.drag = null;
      renderAll();
      return;
    }
    var pos = S.doc.layout.nodes[dev.id] || autoPosition();
    S.drag = { type: 'node', id: dev.id, startX: e.clientX, startY: e.clientY, ox: pos.x, oy: pos.y, moved: false };
    renderAll();
    return;
  }

  // 空白处：平移画布 + 取消选中
  S.view.selectedDevice = '';
  S.drag = {
    type: 'pan', startX: e.clientX, startY: e.clientY,
    camX: S.view.cam.x, camY: S.view.cam.y, moved: false
  };
  renderAll();
}

function parsePortAttr(value) {
  if (!value) return null;
  var parts = String(value).split('|');
  if (parts.length !== 2) return null;
  return { device: parts[0], port: parts[1] };
}

function onPointerMove(e) {
  var d = S.drag;
  if (!d) return;
  var dx = e.clientX - d.startX, dy = e.clientY - d.startY;
  if (!d.moved && Math.abs(dx) + Math.abs(dy) > 3) d.moved = true;

  if (d.type === 'pan') {
    S.view.cam.x = d.camX - dx / S.view.cam.zoom;
    S.view.cam.y = d.camY - dy / S.view.cam.zoom;
    renderCanvas();
    return;
  }
  if (d.type === 'node') {
    if (!d.moved) return;
    var pos = { x: Math.round(d.ox + dx / S.view.cam.zoom), y: Math.round(d.oy + dy / S.view.cam.zoom) };
    S.doc.layout.nodes[d.id] = pos;
    renderCanvas();
    return;
  }
  if (d.type === 'wire') {
    var s = portPointById(d.from.device, d.from.port);
    var preview = $('wirePreview');
    if (!s || !preview) return;
    var w = worldFromScreen(e.clientX, e.clientY);
    var geo = bezierOf(s, { x: w.x, y: w.y, side: w.x < s.x ? -1 : 1 }, 0, 0);
    preview.setAttribute('d', geo.d);
  }
}

function onPointerUp(e) {
  var d = S.drag;
  S.drag = null;
  if (!d) return;

  if (d.type === 'pan') {
    // 没移动 = 点击：命中连线则删除（画布每次 pointerdown 都重绘，原生 click 不可靠，故在 pointerup 判定）
    if (!d.moved && S.view.mode !== 'relation') {
      var hit = document.elementFromPoint(e.clientX, e.clientY);
      var linkEl = hit && hit.closest ? hit.closest('[data-link]') : null;
      var sigEl = hit && hit.closest ? hit.closest('[data-sig]') : null;
      if (linkEl) deletePhysicalLink(linkEl.getAttribute('data-link'));
      else if (sigEl) deleteSignalLink(sigEl.getAttribute('data-sig'));
    }
    return;
  }

  if (d.type === 'node') {
    if (d.moved) {
      S.dirty = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(persistCurrent, 350);
      renderAll();
    }
    return;
  }

  if (d.type === 'wire') {
    if (!d.moved) {
      // 单击端口：路由视图下用于"选流 → 点目标口"
      if (S.view.mode === 'routing') handlePortClick(d.from.device, d.from.port);
      renderAll();
      return;
    }
    var el = document.elementFromPoint(e.clientX, e.clientY);
    var portEl = el && el.closest ? el.closest('[data-port]') : null;
    var target = portEl ? parsePortAttr(portEl.getAttribute('data-port')) : null;
    if (!target || (target.device === d.from.device && target.port === d.from.port)) { renderAll(); return; }
    if (S.view.mode === 'physical') connect(d.from, target);
    else connectSignalByDrag(d.from, target);
    renderAll();
  }
}

function onWheel(e) {
  e.preventDefault();
  zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.12 : 1 / 1.12);
}

function onContextMenu(e) {
  e.preventDefault();
  hideMenu();
  var t = e.target;
  var devEl = t.closest ? t.closest('[data-dev]') : null;
  if (devEl) {
    var dev = deviceById(devEl.getAttribute('data-dev'));
    if (!dev) return;
    S.view.selectedDevice = dev.id;
    renderAll();
    showMenu(e.clientX, e.clientY, [
      { title: dev.name },
      { label: '编辑设备…', onClick: function () { openDeviceEditor(dev.id); } },
      { sep: true },
      { label: '删除设备', danger: true, onClick: function () {
        confirmDialog('删除设备', '确定删除「' + esc(dev.name) + '」？其全部连线将一并删除。', function () {
          removeDevice(dev.id);
          toast('已删除设备', 'ok');
        }, '删除');
      } }
    ]);
    return;
  }

  var world = worldFromScreen(e.clientX, e.clientY);
  var items = [{ title: '添加设备' }];
  S.templates.forEach(function (tpl) {
    items.push({
      label: tpl.name + '（' + tpl.type + '）',
      onClick: function () {
        var dev2 = addDevice(tpl, world);
        if (dev2) { S.view.selectedDevice = dev2.id; renderAll(); toast('已添加：' + dev2.name, 'ok'); }
      }
    });
  });
  items.push({ sep: true });
  items.push({ label: '添加设备…', onClick: openAddDeviceDialog });
  items.push({ label: '整理布局', onClick: tidyLayout });
  items.push({ label: '适应画布', onClick: function () { fitView(); } });
  items.push({ sep: true });
  items.push({ label: '设备模板…', onClick: openTemplateManager });
  items.push({ label: '图库…', onClick: openLibrary });
  showMenu(e.clientX, e.clientY, items);
}


/* ============================================================================
 * 事件绑定与启动
 * ========================================================================= */
function onKeyDown(e) {
  var t = e.target;
  var typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if (e.key === 'Escape') {
    hideMenu();
    if (S.modalStack.length) { closeModal(); return; }
    if (S.view.armed || S.view.picking) { disarm(); return; }
    S.view.selectedDevice = '';
    renderAll();
    return;
  }
  if (e.ctrlKey || e.metaKey) {
    // 用 e.code 判断物理键：中文输入法激活时 e.key 是 "Process"
    var code = e.code;
    if (code === 'KeyZ' || e.keyCode === 90) {
      if (typing) return;
      e.preventDefault();
      if (e.shiftKey) { if (redo()) toast('已重做', 'ok'); }
      else if (undo()) toast('已撤销', 'ok');
      else toast('没有可撤销的操作', 'warn');
      return;
    }
    if (code === 'KeyY' || e.keyCode === 89) {
      if (typing) return;
      e.preventDefault();
      if (redo()) toast('已重做', 'ok'); else toast('没有可重做的操作', 'warn');
      return;
    }
    if (code === 'KeyS' || e.keyCode === 83) {
      e.preventDefault();
      saveToLibrary();
      return;
    }
  }
  if ((e.key === 'Delete' || e.key === 'Backspace') && !typing && S.view.selectedDevice) {
    var dev = deviceById(S.view.selectedDevice);
    if (dev) {
      e.preventDefault();
      confirmDialog('删除设备', '确定删除「' + esc(dev.name) + '」？其全部连线将一并删除。', function () {
        removeDevice(dev.id);
        toast('已删除设备', 'ok');
      }, '删除');
    }
  }
}

function bindEvents() {
  var canvas = $('canvas');
  canvas.addEventListener('pointerdown', onCanvasPointerDown);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('wheel', onWheel, { passive: false });
  canvas.addEventListener('contextmenu', onContextMenu);

  window.addEventListener('keydown', onKeyDown);
  window.addEventListener('resize', function () { renderCanvas(); });

  // 顶栏
  $('zoomCtl').addEventListener('click', function (e) {
    var b = e.target.closest('[data-zoom]');
    if (!b) return;
    var action = b.getAttribute('data-zoom');
    if (action === 'fit') { fitView(); return; }
    if (action === 'reset') { setZoom(1); return; }
    zoomAtCenter(action === 'in' ? 1.2 : 1 / 1.2);
  });

  var demoBtn = document.querySelector('[data-demo]');
  if (demoBtn) demoBtn.addEventListener('click', function () { openDemo(); });

  $('btnUndo').addEventListener('click', function () { if (undo()) toast('已撤销', 'ok'); });
  $('btnRedo').addEventListener('click', function () { if (redo()) toast('已重做', 'ok'); });
  $('btnFit').addEventListener('click', function () { fitView(); });
  $('btnTidy').addEventListener('click', tidyLayout);
  $('btnTpl').addEventListener('click', openTemplateManager);
  $('btnLib').addEventListener('click', openLibrary);
  $('btnAdd').addEventListener('click', openAddDeviceDialog);
  $('btnSave').addEventListener('click', saveToLibrary);
  $('btnExport').addEventListener('click', exportJson);
  $('btnImport').addEventListener('click', function () { $('fileInput').click(); });
  $('fileInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) importFile(f);
    e.target.value = '';
  });
  $('tplInput').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0];
    if (f) importTemplates(f);
    e.target.value = '';
  });
  $('graphName').addEventListener('input', function (e) {
    S.doc.name = e.target.value;
    S.doc.graph.name = e.target.value;
    S.dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(persistCurrent, 350);
  });
  $('viewSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mode]');
    if (b) switchMode(b.getAttribute('data-mode'));
  });

  // 流面板 / 选流条（事件委托，内容随时重绘）
  $('flowPanel').addEventListener('click', function (e) {
    if (e.target.closest('[data-flow-all]')) { S.view.selectedFlow = ''; renderAll(); return; }
    var f = e.target.closest('[data-flow]');
    if (f) {
      var addr = f.getAttribute('data-flow');
      S.view.selectedFlow = S.view.selectedFlow === addr ? '' : addr;
      renderAll();
    }
  });
  $('connectBar').addEventListener('click', function (e) {
    if (e.target.closest('[data-pick-cancel]') || e.target.closest('[data-arm-cancel]')) { disarm(); return; }
    var b = e.target.closest('[data-pick]');
    if (b && S.view.picking) {
      var found = portByRef(S.view.picking.deviceId, S.view.picking.portId);
      var entry = found && (found.port.multicast_out || [])[Number(b.getAttribute('data-pick'))];
      if (entry) selectStream(entry);
    }
  });

  // 菜单点击
  $('menu').addEventListener('click', function (e) {
    var mi = e.target.closest('[data-mi]');
    if (!mi) return;
    var item = ($('menu').__items || [])[Number(mi.getAttribute('data-mi'))];
    hideMenu();
    if (item && !item.disabled && item.onClick) item.onClick();
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#menu') && !e.target.closest('#canvas')) hideMenu();
  });
}

function boot() {
  // 模板：没有就灌种子
  var tpls = lsGet(LS_TPL, null);
  if (!Array.isArray(tpls) || !tpls.length) {
    tpls = seedTemplates();
    lsSet(LS_TPL, tpls);
  }
  S.templates = tpls;
  S.library = lsGet(LS_LIB, []);

  var cur = lsGet(LS_CUR, null);
  var ui = lsGet(LS_UI, { mode: 'physical' });
  if (cur && cur.doc && cur.doc.graph && Array.isArray(cur.doc.graph.devices)) {
    try {
      S.doc = normalizeDoc(cur.doc);
      S.doc.id = cur.doc.id || null;
      S.doc.name = cur.doc.name || '未命名信号图';
      S.view.mode = cur.mode || ui.mode || 'physical';
    } catch (err) {
      S.doc = emptyDoc();
    }
  } else {
    S.doc = emptyDoc();
    S.view.mode = ui.mode || 'physical';
  }
  $('graphName').value = S.doc.name;
  if (S.view.mode === 'physical' && suggestedMode(S.doc) === 'routing') S.view.mode = 'routing';

  bindEvents();
  applyViewMode();
  markSaved();

  window.addEventListener('error', function (ev) {
    var box = $('bootError');
    box.classList.remove('hidden');
    box.textContent = '脚本错误：' + (ev.message || ev.error);
  });
}

boot();

/* 调试/自动化钩子：只暴露引用，不改变业务逻辑（供测试脚本与本地排障使用） */
window.__SF__ = {
  S: S,
  doc: function () { return S.doc; },
  devices: devices,
  links: links,
  flows: function () { return allFlows(); },
  trace: function () { return traceSignals(); },
  addDevice: addDevice,
  removeDevice: removeDevice,
  updateDevice: updateDevice,
  connect: connect,
  connectSignal: connectSignal,
  snapshot: snapshot,
  undo: undo,
  redo: redo,
  openDemo: openDemo,
  saveToLibrary: saveToLibrary,
  render: renderAll,
  templates: function () { return S.templates; },
  normalizeDoc: normalizeDoc,
  importDocs: importDocs,
  importTemplates: importTemplates,
  normalizeTemplate: normalizeTemplate,
  geom: function (id) { var d = deviceById(id); return d ? nodeGeom(d) : null; },
  portPoint: portPointById,
  fitView: fitView
};

})();
</script>
</body>
</html>
