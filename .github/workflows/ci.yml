name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: 语法检查 + 端到端自检
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 提取内联脚本并做语法检查
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('sysflow.html','utf8');const m=h.match(/<script>([\s\S]*?)<\/script>/);if(!m){console.error('未找到 <script> 块');process.exit(1)}fs.writeFileSync('/tmp/sf.check.js',m[1]);"
          node --check /tmp/sf.check.js

      - name: 启动无头 Chrome
        run: |
          google-chrome --version
          google-chrome --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --remote-debugging-port=9224 --user-data-dir="$PWD/.tmp/profile" \
            --window-size=1600,1000 "file://$PWD/sysflow.html" &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9224/json/version > /dev/null; then echo "Chrome 就绪"; break; fi
            sleep 1
          done

      - name: 端到端自检
        run: node tools/e2e.cjs 9224 .tmp

      - name: 上传截图与报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            .tmp/*.png
            .tmp/report.json
          if-no-files-found: ignore
          retention-days: 7
