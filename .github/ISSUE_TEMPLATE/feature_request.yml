name: ✨ 功能建议
description: 提一个改进或新功能的想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        先谢谢你的想法！如果是"怎么用""能不能这样做"这类开放讨论，建议去
        [Discussions](https://github.com/agamecat/systemflow/discussions) 聊；确定了要做什么再开 Issue。

  - type: textarea
    id: background
    attributes:
      label: 你遇到的场景
      description: 你在画什么图、卡在哪一步，现在的做法有多麻烦
      placeholder: 我们机房有 30 多台设备，每次排查一路信号要……
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作
      description: 越具体越好，可以描述交互、界面或数据
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案（可选）
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 大致属于哪一块
      options:
        - 视图 / 布局
        - 设备与端口编辑
        - 组播与信号追踪
        - 导入 / 导出 / 存储
        - 性能
        - 文档
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: 项目约束
      options:
        - label: 我理解这个项目不引入第三方依赖（零依赖是硬约束），方案不需要 npm 包
          required: true
